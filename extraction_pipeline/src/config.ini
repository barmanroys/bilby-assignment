[columns]
ID_COL = uuid
EN_TITLE = title_en
SOURCE_TITLE = title_source_language
EN_BODY = body_en
SOURCE_BODY = body_source_language
ENT_TYPE = entity_type
ENT_TEXT = entity_text
START = start_pos
END = end_pos
SCORE = score
MATCHED = is_matched
MATCHED_ENT_ID = matched_entity_id
MATCHED_ENT_NAME = matched_entity_name
CONCAT_TITLE = title
[db]
DIALECT = mysql
DRIVER = mysqlconnector
PORT = 3306
TABLE = extracted_entities

[local_resource]
DATA_DIR = ../data
ENTITY_FILE = entity_aliases.parquet
DOC_SOURCE = documents.parquet

[ner_service]
HOST = localhost
PORT = 8081
ROUTE = extract_entities/
