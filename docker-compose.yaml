services:
  database:
    image: mysql
    container_name: database-container
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # mysql -h 127.0.0.1 -p
      MYSQL_USER: ${USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      TZ: "Asia/Singapore"
    ports:
      - "3306:3306"
    volumes:
      # This directory is used to initialise the database. Use read-only mount
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - "bilby"

  ner:
    # Do not expose ports for this service
    build:
      context: ./ner_service/ # Directory containing the Dockerfile
      dockerfile: Dockerfile
    container_name: ner-service-container
    networks:
      - "bilby"

networks:
  bilby:
    driver: bridge
